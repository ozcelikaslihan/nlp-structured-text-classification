[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-structured-nlp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "ollama==0.6.1",
  "pydantic==2.12.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

